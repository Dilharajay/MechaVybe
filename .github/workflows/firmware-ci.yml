name: Firmware CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'firmware/**'
      - 'modeling/model/model.h'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'firmware/**'
      - 'modeling/model/model.h'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build Firmware (esp32-s3)
      working-directory: ./firmware
      run: pio run -e esp32-s3

    - name: Upload Firmware Binary
      uses: actions/upload-artifact@v4
      with:
        name: mechavybe-firmware
        path: firmware/.pio/build/esp32-s3/firmware.bin
        retention-days: 7
